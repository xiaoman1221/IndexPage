<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bedGlow" cx="66%" cy="32%" r="58%">
      <stop offset="0" stop-color="#49ffb8" stop-opacity=".3"/>
      <stop offset=".55" stop-color="#49ffb8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#080906" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bedBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a13"/>
      <stop offset=".6" stop-color="#080d0a"/>
