<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="blogGlow" cx="67%" cy="28%" r="58%">
      <stop offset="0" stop-color="#e6ff2e" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#e6ff2e" stop-opacity=".06"/>
      <stop offset="1" stop-color="#080906" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b0d"/>
      <stop offset=".55" stop-color="#0b0d08"/>
      <stop offset="1" stop-color="#070806"/>
    </linearGradient>
    <pattern id="blogGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#e6ff2e" stroke-opacity=".08"/>
    </pattern>
    <filter id="blogNoise">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#blogBg)"/>
  <rect width="800" height="1000" fill="url(#blogGlow)"/>
  <rect width="800" height="1000" fill="url(#blogGrid)"/>

  <g fill="none" stroke="#e6ff2e">
    <circle cx="420" cy="430" r="342" stroke-opacity=".1" stroke-dasharray="1 12"/>
    <circle cx="420" cy="430" r="290" stroke-opacity=".19" stroke-dasharray="94 28 2 28"/>
    <circle cx="420" cy="430" r="232" stroke-opacity=".11"/>
    <circle cx="420" cy="430" r="168" stroke-opacity=".2" stroke-dasharray="24 12"/>
    <circle cx="420" cy="430" r="104" stroke-opacity=".32"/>
    <path d="M420 60v740M50 430h740" stroke-opacity=".07"/>
    <path d="M420 100v36M420 724v36M120 430h36M684 430h36" stroke-opacity=".55"/>
    <rect x="352" y="362" width="136" height="136" stroke-opacity=".7" transform="rotate(45 420 430)"/>
    <circle cx="420" cy="430" r="7" fill="#e6ff2e"/>
  </g>

  <g font-family="monospace" fill="#e6ff2e" letter-spacing="5">
    <text x="52" y="76" font-size="14" fill-opacity=".6">01 / BLOG</text>
    <text x="748" y="76" font-size="13" text-anchor="end" fill-opacity=".35">ARCHIVE 2026</text>
    <text x="52" y="886" font-size="13" fill-opacity=".4">FIELD NOTES</text>
    <text x="52" y="916" font-size="13" fill-opacity=".22">WRITING / THINKING / LIVING</text>
    <text x="748" y="916" font-size="13" text-anchor="end" fill-opacity=".35">SIGNAL 92</text>
  </g>

  <path d="M52 120h120M52 132h72" stroke="#e6ff2e" stroke-opacity=".3"/>
  <rect width="800" height="1000" filter="url(#blogNoise)" opacity=".055"/>
</svg>
