<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0066FF" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="满久琦（小满1221）· 运维、学生、开发、博主。天上如是，地下亦然。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta
      property="og:title"
      content="满久琦 · 小满1221 | Xiaoman's Ink"
    />
    <meta
      property="og:description"
      content="满久琦（小满1221）· 运维、学生、开发、博主。天上如是，地下亦然。"
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/JetBrainsSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Static fallback for crawlers / no-JS; config.json overrides at runtime. -->
    <title>满久琦 · 小满1221 | Xiaoman's Ink</title>
    <link rel="stylesheet" href="/src/style.css" />
    <noscript>
      <style>
        .boot,
        .cursor {
          display: none !important;
        }
        [data-reveal],
        .hero-title .line > span {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <a class="skip-link" href="#main">跳至主内容</a>

    <!-- 启动画面：资源加载 -->
    <div class="boot" id="boot" aria-hidden="true">
      <div class="boot-bg" aria-hidden="true"></div>
      <div class="boot-noise" aria-hidden="true"></div>

      <div class="boot-rail" aria-hidden="true">
        <i id="boot-bar"></i>
      </div>

      <div class="boot-readout" aria-hidden="true">
        <span class="boot-percent">
          <span id="boot-percent">00</span><em>%</em>
        </span>
        <span class="boot-status" id="boot-status">LINK HANDSHAKE</span>
      </div>

      <div class="boot-lockup">
        <p class="boot-kicker" id="boot-kicker"></p>
        <div class="boot-brand-row">
          <span class="boot-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M20 2 38 20 20 38 2 20 20 2Z" stroke="currentColor" />
              <path
                d="M20 10 30 20 20 30 10 20 20 10Z"
                fill="currentColor"
                fill-opacity=".08"
                stroke="currentColor"
              />
              <path d="M20 16v8M16 20h8" stroke="currentColor" />
            </svg>
          </span>
          <span class="boot-wordmark">
            <b id="boot-brand-cn">小满1221</b>
            <small id="boot-brand-en">MAN JIUQI / 满久琦</small>
          </span>
        </div>
      </div>

      <div class="boot-footer" aria-hidden="true">
        <div class="boot-legal">
          <span class="boot-tri" aria-hidden="true"></span>
          <span id="boot-legal">XIAOMAN1221 // PERSONAL ARCHIVE</span>
        </div>
        <span class="boot-divider" aria-hidden="true"></span>
        <p class="boot-slogan" id="boot-title"></p>
        <small class="boot-slogan-en">AS ABOVE / SO BELOW</small>
      </div>

      <p class="boot-hint" id="boot-hint"></p>
    </div>

    <!-- 小节切换预加载 -->
    <div class="section-loader" id="section-loader" aria-hidden="true">
      <span class="section-loader-scan" aria-hidden="true"></span>
      <div class="section-loader-panel">
        <span class="section-loader-kicker">LOADING // SECTION</span>
        <div class="section-loader-title">
          <b id="section-loader-index">01</b>
          <span id="section-loader-name">ABOUT</span>
        </div>
        <div class="section-loader-bar"><i id="section-loader-bar"></i></div>
        <span class="section-loader-status" id="section-loader-status">
          SYNCING
        </span>
      </div>
    </div>

    <!-- 背景 -->
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="swarm" aria-hidden="true"></canvas>
    <div class="fx-tech-grid" aria-hidden="true"></div>
    <div class="fx-grain" aria-hidden="true"></div>
    <div class="fx-vignette" aria-hidden="true"></div>
    <div class="fx-scanlines" aria-hidden="true"></div>
    <div class="hud-corners" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="scroll-progress" aria-hidden="true">
      <i id="scroll-progress-bar"></i>
    </div>

    <!-- 顶部导航 -->
    <header class="site-header" id="site-header">
      <a class="brand" href="#home" aria-label="小满1221 首页">
        <span class="brand-mark" id="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M20 2 38 20 20 38 2 20 20 2Z" stroke="currentColor" />
            <path d="M20 10 30 20 20 30 10 20 20 10Z" stroke="currentColor" />
            <path d="M20 16v8M16 20h8" stroke="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <b id="brand-name"></b>
          <small id="brand-sub"></small>
        </span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="主导航"></nav>

      <div class="header-side">
        <span class="clock" id="clock" aria-label="北京时间">--:--:--</span>
        <a
          class="hud-btn"
          id="header-cta"
          href="https://www.yhdzz.cn/"
          target="_blank"
          rel="noreferrer"
        >
          <span id="header-cta-label">BLOG</span><i aria-hidden="true">↗</i>
        </a>
        <button
          class="menu-btn"
          id="menu-btn"
          type="button"
          aria-label="打开菜单"
          aria-expanded="false"
          aria-controls="main-nav"
        >
          <span></span><span></span>
        </button>
      </div>
    </header>

    <!-- 右侧章节索引 -->
    <aside class="rail" aria-label="章节索引">
      <div class="rail-track"></div>
      <span class="rail-code" id="rail-code">
        <span id="rail-line1"></span><br /><span id="rail-line2"></span>
      </span>
    </aside>

    <!-- 左侧遥测装饰 -->
    <aside class="telemetry" aria-hidden="true">
      <span class="telemetry-label">SYS.FEED</span>
      <span class="telemetry-bar"><i></i></span>
      <span class="telemetry-bar"><i></i></span>
      <span class="telemetry-bar"><i></i></span>
      <span class="telemetry-value" id="telemetry-value">SIG 98.4</span>
      <span class="telemetry-hex" id="telemetry-hex">0x7A2F</span>
      <span class="telemetry-dot"></span>
    </aside>

    <main id="main">
      <!-- 00 首页 -->
      <section class="section hero" id="home" data-section="home">
        <div class="hero-media" id="hero-media" aria-hidden="true"></div>
        <div class="hero-bg-type" id="hero-bg-type" aria-hidden="true"></div>

        <div class="hero-inner">
          <div class="hero-copy">
            <p class="eyebrow" id="hero-eyebrow" data-reveal></p>
            <h1 class="hero-title" id="hero-title"></h1>
            <p class="hero-sub" id="hero-sub" data-reveal style="--d: 0.08s"></p>
            <div
              class="hero-actions"
              id="hero-actions"
              data-reveal
              style="--d: 0.16s"
            ></div>
          </div>

          <div class="hero-sigil" aria-hidden="true">
            <svg class="sigil-svg" viewBox="0 0 420 420" fill="none">
              <g class="sigil-orbit sigil-orbit-a">
                <circle cx="210" cy="210" r="198" stroke-dasharray="1 10" />
                <circle
                  cx="210"
                  cy="210"
                  r="198"
                  stroke-dasharray="60 40"
                  opacity=".5"
                />
              </g>
              <g class="sigil-orbit sigil-orbit-b">
                <circle
                  cx="210"
                  cy="210"
                  r="158"
                  stroke-dasharray="90 18 4 18"
                />
              </g>
              <g class="sigil-ticks">
                <path d="M210 4v18M210 398v18M4 210h18M398 210h18" />
                <path d="M210 22v8M210 390v8M22 210h8M390 210h8" />
              </g>
              <g class="sigil-core">
                <path d="M210 118 302 210 210 302 118 210 210 118Z" />
                <path
                  d="M210 150 270 210 210 270 150 210 210 150Z"
                  opacity=".55"
                />
                <path d="M210 118v184M118 210h184" opacity=".35" />
                <circle cx="210" cy="210" r="4" class="sigil-dot" />
              </g>
              <g class="sigil-labels">
                <text id="sigil-lat" x="210" y="34" text-anchor="middle"></text>
                <text id="sigil-lng" x="392" y="214" text-anchor="end"></text>
                <text id="sigil-alt" x="210" y="398" text-anchor="middle"></text>
                <text id="sigil-ref" x="20" y="214"></text>
              </g>
            </svg>
            <span class="sigil-scan"></span>

            <!-- 3D hologram: rotating cube + orbital rings -->
            <div class="hologram" aria-hidden="true">
              <div class="holo-stage">
                <span class="holo-ring holo-ring-a"></span>
                <span class="holo-ring holo-ring-b"></span>
                <span class="holo-ring holo-ring-c"></span>
                <span class="holo-cube">
                  <span class="holo-face holo-face-front"></span>
                  <span class="holo-face holo-face-back"></span>
                  <span class="holo-face holo-face-right"></span>
                  <span class="holo-face holo-face-left"></span>
                  <span class="holo-face holo-face-top"></span>
                  <span class="holo-face holo-face-bottom"></span>
                </span>
              </div>
            </div>
          </div>
        </div>

        <div class="hero-meta" id="hero-meta"></div>
      </section>

      <!-- 01 档案 -->
      <section class="section profile" id="profile" data-section="profile">
        <div class="section-head" data-reveal>
          <span class="sec-index" id="profile-index"></span>
          <div class="sec-titles">
            <h2>
              <span id="profile-title"></span>
              <small id="profile-title-en"></small>
            </h2>
          </div>
          <span class="sec-note" id="profile-note"></span>
        </div>

        <div class="profile-grid">
          <div class="profile-copy">
            <p class="display-quote" id="profile-intro" data-reveal></p>
            <p
              class="body-copy"
              id="profile-bio"
              data-reveal
              style="--d: 0.08s"
            ></p>
            <figure class="quote-terminal" data-reveal style="--d: 0.16s">
              <div class="qt-bar">
                <span class="qt-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="qt-title">hitokoto — ~/quote</span>
                <span class="qt-state" id="quote-state">ONLINE</span>
                <button
                  class="quote-refresh"
                  id="quote-refresh"
                  type="button"
                  aria-label="换一句一言"
                  hidden
                >
                  <span aria-hidden="true">↻</span> rerun
                </button>
              </div>
              <div class="qt-screen">
                <p class="qt-command" aria-hidden="true">
                  <span class="qt-user">xiaoman@ink</span><span class="qt-sep">:</span><span class="qt-path">~</span><span class="qt-prompt">$</span><span class="qt-cmd">hitokoto --random</span>
                </p>
                <div class="qt-body" id="quote-body">
                  <blockquote id="quote-text"></blockquote>
                  <figcaption class="qt-meta" id="quote-meta">
                    <span id="quote-source"></span><i id="quote-author"></i>
                  </figcaption>
                </div>
                <div
                  class="qt-output"
                  id="quote-output"
                  role="status"
                  aria-live="polite"
                  hidden
                ></div>
                <p class="qt-prompt-line">
                  <span class="qt-user" aria-hidden="true">xiaoman@ink</span><span class="qt-sep" aria-hidden="true">:</span><span class="qt-path" aria-hidden="true">~</span><span class="qt-prompt" aria-hidden="true">$</span>
                  <span class="qt-input-wrap">
                    <input
                      id="quote-input"
                      class="qt-input"
                      type="text"
                      autocomplete="off"
                      autocapitalize="off"
                      autocorrect="off"
                      spellcheck="false"
                      enterkeyhint="go"
                      aria-label="终端命令输入，输入 help 查看可用命令"
                    />
                    <span class="qt-typed" id="quote-typed" aria-hidden="true"></span>
                    <span class="qt-caret" aria-hidden="true"></span>
                  </span>
                </p>
              </div>
            </figure>
            <div
              class="profile-stats"
              id="profile-stats"
              data-reveal
              style="--d: 0.2s"
            ></div>
          </div>

          <aside
            class="id-panel"
            data-reveal
            style="--d: 0.12s"
            aria-label="身份信息"
          >
            <div class="id-panel-head">
              <span id="id-head-left"></span><span id="id-head-right"></span>
            </div>
            <div class="id-avatar" id="id-avatar" aria-hidden="true">
              <div class="id-avatar-grid"></div>
              <span class="id-monogram" id="id-monogram"></span>
              <span class="id-avatar-caption" id="id-caption"></span>
              <span class="id-corner id-corner-tl"></span>
              <span class="id-corner id-corner-tr"></span>
              <span class="id-corner id-corner-bl"></span>
              <span class="id-corner id-corner-br"></span>
            </div>
            <dl class="spec-list" id="spec-list"></dl>
            <div class="id-foot">
              <div class="id-barcode" aria-hidden="true"></div>
              <span id="id-code"></span>
            </div>
          </aside>
        </div>
      </section>

      <!-- 02 领域 -->
      <section class="section field" id="field" data-section="field">
        <div class="section-head" data-reveal>
          <span class="sec-index" id="field-index"></span>
          <div class="sec-titles">
            <h2>
              <span id="field-title"></span>
              <small id="field-title-en"></small>
            </h2>
          </div>
          <span class="sec-note" id="field-note"></span>
        </div>

        <div class="field-lead">
          <p id="field-lead" data-reveal></p>
          <span id="field-lead-note" data-reveal style="--d: 0.08s"></span>
        </div>

        <div class="tech-stack" data-reveal>
          <span class="tech-stack-label">// TECH STACK / 技术栈</span>
          <div class="tech-stack-items" id="tech-stack-items"></div>
        </div>

        <div class="cap-list" id="cap-list"></div>

        <div class="marquee marquee-stroke" aria-hidden="true">
          <div class="marquee-track" id="field-marquee"></div>
        </div>
      </section>

      <!-- 03 作品 -->
      <section class="section works" id="works" data-section="works">
        <div class="section-head" data-reveal>
          <span class="sec-index" id="works-index"></span>
          <div class="sec-titles">
            <h2>
              <span id="works-title"></span>
              <small id="works-title-en"></small>
            </h2>
          </div>
          <span class="sec-note" id="works-note"></span>
        </div>

        <div class="works-intro">
          <p class="works-quote" id="works-quote" data-reveal></p>
          <div class="carousel-controls" data-reveal style="--d: 0.08s">
            <span class="carousel-count"
              ><b id="work-current">01</b> / <span id="work-total">04</span></span
            >
            <div class="carousel-btns">
              <button
                class="carousel-btn"
                id="work-prev"
                type="button"
                aria-label="上一项"
              >
                ←
              </button>
              <button
                class="carousel-btn"
                id="work-next"
                type="button"
                aria-label="下一项"
              >
                →
              </button>
            </div>
          </div>
        </div>

        <div
          class="work-track"
          id="work-track"
          role="region"
          aria-label="精选作品，可横向滚动"
          data-reveal
          style="--d: 0.12s"
        ></div>

        <div
          class="track-progress"
          id="work-scrollbar"
          role="scrollbar"
          aria-controls="work-track"
          aria-label="作品滚动位置"
          aria-orientation="horizontal"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="0"
        >
          <i id="work-progress"></i>
        </div>
        <p class="track-hint" id="track-hint"></p>
      </section>

      <!-- 04 联络 -->
      <section class="section contact" id="contact" data-section="contact">
        <div class="section-head" data-reveal>
          <span class="sec-index" id="contact-index"></span>
          <div class="sec-titles">
            <h2>
              <span id="contact-title"></span>
              <small id="contact-title-en"></small>
            </h2>
          </div>
          <span class="sec-note" id="contact-note"></span>
        </div>

        <div class="contact-bg-type" aria-hidden="true">CONTACT</div>

        <div class="contact-inner">
          <p class="contact-kicker" id="contact-kicker" data-reveal></p>
          <a
            class="mail-link"
            id="contact-email"
            href="mailto:im@manjiuqi.com"
            data-reveal
            style="--d: 0.06s"
          >
            <span id="contact-email-text"></span>
            <i>↗</i>
          </a>
          <p
            class="contact-line"
            id="contact-line"
            data-reveal
            style="--d: 0.12s"
          ></p>

          <div
            class="contact-grid"
            id="contact-grid"
            data-reveal
            style="--d: 0.18s"
          ></div>
        </div>
      </section>
      <!-- 05 页脚 -->
      <div class="slide slide-footer" id="footer" data-slide="footer">
        <div class="footer-wordmark" aria-hidden="true">
          <span>XIAOMAN'S INK</span>
          <small>AS ABOVE / SO BELOW</small>
        </div>

        <div class="ticker" aria-hidden="true">
          <div class="ticker-track" id="ticker-track"></div>
        </div>

        <footer class="site-footer">
          <div class="footer-inner">
            <span class="footer-copy" id="footer-copy"></span>
            <span class="footer-meta" id="footer-credits"></span>
            <a class="footer-top" id="footer-top" href="#home"></a>
          </div>
          <div class="footer-filings" id="footer-filings"></div>
        </footer>
      </div>
    </main>

    <a class="back-top" id="back-top" href="#home" aria-label="回到顶部">
      <span>BACK TO TOP</span>
      <i aria-hidden="true">↑</i>
    </a>

    <div class="cursor" id="cursor" aria-hidden="true">
      <span class="cursor-dot"></span>
      <span class="cursor-ring"></span>
    </div>

    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          z-index: 300;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #080906;
          color: #edede4;
          font-family: sans-serif;
          text-align: center;
        "
      >
        <p>此主页由 config.json 驱动，请启用 JavaScript 后查看。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
